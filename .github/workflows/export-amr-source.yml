name: Export AMR Source

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Package AMR source and icons
        run: |
          mkdir -p export
          cp Amr_utility.ps1 export/Amr_utility.ps1
          cp Icons.zip export/Icons.zip

      - name: Upload source and icons artifact
        uses: actions/upload-artifact@v4
        with:
          name: AMR-Source-and-Icons-ReadOnly
          path: export/
          if-no-files-found: error
          retention-days: 7
