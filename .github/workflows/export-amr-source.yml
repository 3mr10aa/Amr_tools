
name: Export AMR Source

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Package AMR source
        run: |
          mkdir -p export
          cp Amr_utility.ps1 export/Amr_utility.ps1

      - name: Upload source artifact
        uses: actions/upload-artifact@v4
        with:
          name: AMR-Source-ReadOnly
          path: export/Amr_utility.ps1
          if-no-files-found: error
          retention-days: 1
